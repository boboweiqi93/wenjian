<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜阑幽邃 · 音频播放器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Inter:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Noto Serif SC', serif;
    background: linear-gradient(160deg, #0a0a1a 0%, #12102e 40%, #1a1040 70%, #0d0d24 100%);
    min-height: 100vh;
    color: #e0dff0;
    overflow-x: hidden;
    position: relative;
  }

  /* 星尘光点背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, rgba(180,170,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 20%, rgba(140,160,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 60%, rgba(200,180,255,0.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, rgba(160,150,255,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 70%, rgba(180,200,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 40%, rgba(170,160,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
  }

  /* 顶部标题 */
  .header {
    text-align: center;
    margin-bottom: 40px;
    padding-top: 20px;
  }

  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 6px;
    color: rgba(200,195,240,0.8);
    text-shadow: 0 0 20px rgba(140,130,220,0.3);
  }

  /* 课程信息 */
  .course-info {
    text-align: center;
    margin-bottom: 36px;
  }

  .course-title {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(160,155,200,0.6);
    margin-bottom: 12px;
  }

  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 2px;
    line-height: 1.6;
    color: rgba(230,225,255,0.95);
    text-shadow: 0 0 30px rgba(140,130,220,0.2);
  }

  /* 进度条 */
  .progress-container {
    margin-bottom: 32px;
  }

  .progress-bar {
    height: 2px;
    background: rgba(100,95,160,0.2);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }

  .progress-fill {
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, rgba(140,130,220,0.6), rgba(180,160,255,0.8));
    border-radius: 2px;
    position: relative;
    box-shadow: 0 0 12px rgba(140,130,220,0.4);
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -3px;
    top: -2px;
    width: 6px;
    height: 6px;
    background: rgba(200,190,255,0.9);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(160,150,240,0.6);
  }

  .time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 10px;
    color: rgba(160,155,200,0.5);
    letter-spacing: 1px;
  }

  /* 播放控制 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    margin-bottom: 36px;
  }

  .control-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(180,175,220,0.7);
    transition: all 0.4s ease;
  }

  .control-btn:hover {
    color: rgba(220,215,255,0.95);
    text-shadow: 0 0 15px rgba(160,150,240,0.5);
  }

  .play-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(140,130,220,0.15);
    border: 1px solid rgba(160,150,240,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(220,215,255,0.9);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(140,130,220,0.2), inset 0 0 15px rgba(160,150,240,0.1);
    transition: all 0.4s ease;
  }

  .play-btn:hover {
    background: rgba(140,130,220,0.25);
    box-shadow: 0 0 35px rgba(140,130,220,0.35), inset 0 0 20px rgba(160,150,240,0.15);
  }

  /* 音量和列表按钮 */
  .bottom-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 32px;
  }

  .volume-slider {
    width: 80px;
    height: 2px;
    -webkit-appearance: none;
    background: rgba(100,95,160,0.25);
    border-radius: 2px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    background: rgba(180,170,240,0.8);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(160,150,240,0.5);
  }

  .list-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(140,130,220,0.1);
    border: 1px solid rgba(160,150,240,0.2);
    color: rgba(180,175,220,0.7);
    font-size: 11px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }

  .list-btn.active {
    background: rgba(140,130,220,0.2);
    border-color: rgba(160,150,240,0.35);
    color: rgba(220,215,255,0.9);
    box-shadow: 0 0 15px rgba(140,130,220,0.2);
  }

  /* 章节列表 */
  .playlist {
    background: rgba(20,18,50,0.6);
    border: 1px solid rgba(100,95,160,0.15);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(160,150,240,0.08);
  }

  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(100,95,160,0.12);
  }

  .playlist-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(160,155,200,0.6);
  }

  .chapter-group {
    margin-bottom: 8px;
  }

  .chapter-name {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(140,135,180,0.5);
    padding: 8px 0 4px;
  }

  .section-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-left: 2px solid transparent;
  }

  .section-item:hover {
    background: rgba(140,130,220,0.08);
  }

  .section-item.active {
    background: rgba(140,130,220,0.12);
    border-left-color: rgba(180,160,255,0.6);
  }

  .section-name {
    font-size: 12px;
    font-weight: 300;
    color: rgba(200,195,230,0.8);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 12px;
  }

  .section-item.active .section-name {
    color: rgba(230,225,255,0.95);
  }

  /* 呼吸灯效果 */
  .breathing-indicator {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }

  .breathing-bar {
    width: 2px;
    background: rgba(180,160,255,0.7);
    border-radius: 1px;
    animation: breathe 1.5s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(160,150,240,0.4);
  }

  .breathing-bar:nth-child(1) { height: 40%; animation-delay: 0s; }
  .breathing-bar:nth-child(2) { height: 70%; animation-delay: 0.2s; }
  .breathing-bar:nth-child(3) { height: 50%; animation-delay: 0.4s; }

  @keyframes breathe {
    0%, 100% { opacity: 0.4; transform: scaleY(0.6); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  .preview-tag {
    font-size: 8px;
    padding: 2px 6px;
    border: 1px solid rgba(180,160,255,0.3);
    border-radius: 4px;
    color: rgba(180,160,255,0.7);
    letter-spacing: 1px;
  }

  /* SVG图标 */
  svg { width: 20px; height: 20px; fill: currentColor; }
  .play-btn svg { width: 24px; height: 24px; margin-left: 2px; }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>闻见 · 音频</h1>
  </header>

  <div class="course-info">
    <div class="course-title">禅修入门 · 第三章</div>
    <div class="section-title">呼吸觉察的练习</div>
  </div>

  <div class="progress-container">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="time-display">
      <span>3:42</span>
      <span>12:08</span>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn">
      <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
    </button>
    <button class="play-btn">
      <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="control-btn">
      <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
    </button>
  </div>

  <div class="bottom-controls">
    <svg style="width:16px;height:16px;color:rgba(160,155,200,0.6)" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <input type="range" class="volume-slider" value="70">
    <button class="list-btn active">
      <svg style="width:14px;height:14px" viewBox="0 0 24 24"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      <span>列表</span>
    </button>
  </div>

  <div class="playlist">
    <div class="playlist-header">
      <span class="playlist-title">章节列表</span>
      <svg style="width:14px;height:14px;color:rgba(160,155,200,0.5);cursor:pointer" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </div>

    <div class="chapter-group">
      <div class="chapter-name">第一章 · 基础认知</div>
      <div class="section-item">
        <span class="section-name">什么是正念冥想</span>
        <span class="preview-tag">试听</span>
      </div>
      <div class="section-item">
        <span class="section-name">冥想的科学依据</span>
      </div>
    </div>

    <div class="chapter-group">
      <div class="chapter-name">第二章 · 实践入门</div>
      <div class="section-item">
        <span class="section-name">坐姿与身体放松</span>
      </div>
      <div class="section-item active">
        <span class="section-name">呼吸觉察的练习</span>
        <div class="breathing-indicator">
          <div class="breathing-bar"></div>
          <div class="breathing-bar"></div>
          <div class="breathing-bar"></div>
        </div>
      </div>
      <div class="section-item">
        <span class="section-name">处理杂念的方法</span>
      </div>
    </div>

    <div class="chapter-group">
      <div class="chapter-name">第三章 · 深入修习</div>
      <div class="section-item">
        <span class="section-name">慈悲心的培养</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
