<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>烟波缥缈 · 音频播放器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Inter:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', 'Noto Serif SC', serif;
    min-height: 100vh;
    background: linear-gradient(165deg, #f5f7fa 0%, #e8edf2 30%, #dfe6ed 60%, #d4dde8 100%);
    color: #4a5568;
    overflow-x: hidden;
    position: relative;
  }

  /* 烟雾纹理层 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 30%, rgba(180,200,220,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 60% 80% at 80% 70%, rgba(160,190,210,0.2) 0%, transparent 60%),
      radial-gradient(ellipse 100% 40% at 50% 50%, rgba(200,215,230,0.15) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .player-container {
    position: relative;
    z-index: 1;
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }

  /* 顶部标题 */
  .header {
    padding: 48px 0 32px;
    text-align: center;
  }

  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 6px;
    color: #7a8a9e;
    opacity: 0.8;
  }

  /* 课程信息区 */
  .track-info {
    text-align: center;
    padding: 20px 0 40px;
    animation: fadeInUp 1s ease-out;
  }

  .course-name {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8a9ab0;
    margin-bottom: 16px;
    font-weight: 400;
  }

  .track-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 300;
    line-height: 1.5;
    color: #3d4f63;
    letter-spacing: 1px;
  }

  /* 进度条 - 烟雾流动感 */
  .progress-section {
    padding: 10px 0 30px;
  }

  .progress-bar {
    position: relative;
    height: 2px;
    background: rgba(160,180,200,0.2);
    border-radius: 2px;
    cursor: pointer;
    overflow: visible;
  }

  .progress-fill {
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, rgba(120,150,180,0.4), rgba(100,140,170,0.7));
    border-radius: 2px;
    position: relative;
    transition: width 0.3s ease;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    background: rgba(100,140,170,0.8);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(100,140,170,0.4);
  }

  .time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #9aacbe;
    font-variant-numeric: tabular-nums;
  }

  /* 播放控制 - 玻璃质感 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 10px 0 30px;
  }

  .ctrl-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    box-shadow:
      0 2px 8px rgba(0,0,0,0.04),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -1px 0 rgba(0,0,0,0.03);
    color: #5a6f85;
  }

  .ctrl-btn:active { transform: scale(0.92); }

  .play-btn {
    width: 64px;
    height: 64px;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    box-shadow:
      0 4px 20px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -1px 0 rgba(0,0,0,0.04);
    color: #3d4f63;
  }

  .play-btn svg { margin-left: 2px; }

  /* 音量与列表按钮 */
  .bottom-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 0 0 20px;
  }

  .volume-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-icon { color: #9aacbe; cursor: pointer; }

  .vol-slider {
    -webkit-appearance: none;
    width: 70px;
    height: 2px;
    background: rgba(160,180,200,0.25);
    border-radius: 2px;
    outline: none;
  }

  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(120,150,180,0.6);
    box-shadow: 0 0 8px rgba(120,150,180,0.3);
    cursor: pointer;
  }

  .list-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(160,180,200,0.25);
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    font-size: 11px;
    letter-spacing: 1px;
    color: #7a8a9e;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .list-btn.active {
    background: rgba(255,255,255,0.35);
    border-color: rgba(120,150,180,0.4);
    color: #5a6f85;
  }

  /* 播放列表面板 */
  .playlist-panel {
    margin-top: 16px;
    padding: 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
    display: none;
    animation: fadeIn 0.4s ease;
  }

  .playlist-panel.show { display: block; }

  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(160,180,200,0.15);
  }

  .playlist-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: #8a9ab0;
  }

  .close-btn {
    background: none;
    border: none;
    color: #9aacbe;
    cursor: pointer;
    padding: 4px;
  }

  .chapter-group { margin-bottom: 12px; }

  .chapter-title {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #9aacbe;
    padding: 8px 0 6px;
    font-weight: 500;
  }

  .track-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 8px;
    border-bottom: 1px solid rgba(160,180,200,0.08);
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.3s ease;
  }

  .track-item:hover { background: rgba(255,255,255,0.15); }

  .track-item.active {
    background: rgba(255,255,255,0.2);
    border-left: 2px solid rgba(100,140,170,0.6);
  }

  .track-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    font-weight: 300;
    color: #4a5568;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
  }

  .track-item.active .track-name { color: #3d4f63; }

  .playing-indicator {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }

  .bar {
    width: 2px;
    background: rgba(100,140,170,0.6);
    border-radius: 1px;
    animation: pulse 1s ease-in-out infinite;
  }

  .bar:nth-child(1) { height: 60%; animation-delay: 0s; }
  .bar:nth-child(2) { height: 100%; animation-delay: 0.2s; }
  .bar:nth-child(3) { height: 40%; animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* 桌面端隐藏移动端样式提示 */
  @media (min-width: 768px) {
    .player-container { padding-top: 40px; }
  }
</style>
</head>
<body>

<div class="player-container">
  <header class="header">
    <h1>闻见 · 音频</h1>
  </header>

  <div class="track-info">
    <div class="course-name">禅修入门 · 第三讲</div>
    <div class="track-title">呼吸觉察的<br>七个层次</div>
  </div>

  <div class="progress-section">
    <div class="progress-bar" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">3:42</span>
      <span id="duration">12:08</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="prev()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 20L9 12l10-8v16z"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" onclick="next()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>

  <div class="bottom-actions">
    <div class="volume-group">
      <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.7">
    </div>
    <button class="list-btn" id="listBtn" onclick="togglePlaylist()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>列表</span>
    </button>
  </div>

  <div class="playlist-panel" id="playlistPanel">
    <div class="playlist-header">
      <span class="playlist-label">章节列表</span>
      <button class="close-btn" onclick="togglePlaylist()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="chapter-group">
      <div class="chapter-title">第一章 · 基础</div>
      <div class="track-item active">
        <span class="track-name">呼吸觉察的七个层次</span>
        <div class="playing-indicator"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      </div>
      <div class="track-item"><span class="track-name">身体扫描冥想引导</span></div>
      <div class="track-item"><span class="track-name">日常正念练习要点</span></div>
    </div>
    <div class="chapter-group">
      <div class="chapter-title">第二章 · 进阶</div>
      <div class="track-item"><span class="track-name">情绪观察与接纳</span></div>
      <div class="track-item"><span class="track-name">慈悲心冥想入门</span></div>
    </div>
  </div>
</div>

<script>
  let isPlaying = false;
  const playBtn = document.getElementById('playBtn');
  const playlistPanel = document.getElementById('playlistPanel');
  const listBtn = document.getElementById('listBtn');

  function togglePlay() {
    isPlaying = !isPlaying;
    playBtn.innerHTML = isPlaying
      ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
      : '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>';
  }

  function togglePlaylist() {
    playlistPanel.classList.toggle('show');
    listBtn.classList.toggle('active');
  }

  function seek(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    document.getElementById('progressFill').style.width = (pct * 100) + '%';
    const totalSec = 728;
    const cur = Math.floor(pct * totalSec);
    document.getElementById('currentTime').textContent = Math.floor(cur/60) + ':' + String(cur%60).padStart(2,'0');
  }

  function prev() {}
  function next() {}
</script>
</body>
</html>
