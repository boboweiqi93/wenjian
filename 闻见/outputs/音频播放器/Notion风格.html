<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程音频播放器 - Notion风格</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#f7f6f3;--surface:#fff;--text:#191919;--text2:#6b6b6b;--accent:#2eaadc;--border:#e8e5e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.sidebar{width:260px;height:calc(100vh - 64px);overflow-y:auto;border-right:1px solid var(--border);background:var(--surface)}
.main{flex:1;height:calc(100vh - 64px);overflow-y:auto;padding-bottom:80px}
.player-bar{position:fixed;bottom:0;left:0;right:0;height:72px;background:var(--surface);border-top:1px solid var(--border);z-index:50;display:flex;align-items:center;padding:0 24px;gap:16px}
.chapter-item{display:flex;align-items:center;padding:12px 16px;cursor:pointer;transition:all .2s;border-bottom:1px solid var(--border)}
.chapter-item:hover{background:#f5f5f4}
.chapter-item.active{background:#eef7fa;border-left:3px solid var(--accent)}
.chapter-item.locked{opacity:.55;cursor:not-allowed}
.progress-track{flex:1;height:4px;background:#e8e5e0;border-radius:2px;cursor:pointer;position:relative}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;width:35%;transition:width .1s}
.btn-icon{width:36px;height:36px;border-radius:6px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .2s}
.btn-icon:hover{background:#f0efec}
.btn-play{width:40px;height:40px;border-radius:50%;background:var(--text);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.btn-play:hover{opacity:.85}
.course-btn{width:100%;text-align:left;padding:10px 16px;border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text2);transition:all .2s;border-radius:6px;margin:2px 0}
.course-btn:hover{background:#f5f5f4;color:var(--text)}
.course-btn.active{background:#eef7fa;color:var(--accent);font-weight:600}
.badge-preview{font-size:11px;padding:2px 6px;border-radius:4px;background:#e8f5e9;color:#2e7d32;font-weight:500}
.badge-lock{font-size:11px;padding:2px 6px;border-radius:4px;background:#f5f5f4;color:#999}
@media(max-width:768px){.sidebar{display:none}.main{height:calc(100vh - 64px)}}
</style>
</head>
<body>
<!-- Header -->
<header style="height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;justify-content:space-between">
  <div style="display:flex;align-items:center;gap:12px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>
    <h1 style="font-size:18px">音频课堂</h1>
  </div>
  <span style="font-size:13px;color:var(--text2)">已开通 3 门课程</span>
</header>

<div style="display:flex">
  <!-- Sidebar -->
  <nav class="sidebar" style="padding:12px">
    <p style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999;padding:8px 16px;font-weight:600">我的课程</p>
    <button class="course-btn active">📖 中国传统文化概论</button>
    <button class="course-btn">📖 古典诗词鉴赏</button>
    <button class="course-btn">📖 书法入门与进阶</button>
    <p style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999;padding:12px 16px 8px;font-weight:600">试听课程</p>
    <button class="course-btn" style="opacity:.7">🔒 茶道美学（未开通）</button>
  </nav>

  <!-- Main Content -->
  <main class="main" style="padding:32px 40px">
    <div style="margin-bottom:24px">
      <h2 style="font-size:28px;margin-bottom:8px">中国传统文化概论</h2>
      <p style="color:var(--text2);font-size:14px;line-height:1.6">探索中华五千年文明的精髓，从哲学、艺术到日常礼仪。</p>
    </div>

    <!-- Chapter List -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);font-weight:600;display:flex;justify-content:space-between">
        <span>第一章 · 儒家思想</span><span>4 节 · 共 48 分钟</span>
      </div>
      <div class="chapter-item active">
        <span style="width:28px;font-size:13px;color:var(--text2)">1.1</span>
        <span style="flex:1;font-size:14px">仁义礼智信的当代诠释</span>
        <span class="badge-preview">试听</span>
        <span style="font-size:12px;color:var(--text2);margin-left:12px">12:30</span>
      </div>
      <div class="chapter-item">
        <span style="width:28px;font-size:13px;color:var(--text2)">1.2</span>
        <span style="flex:1;font-size:14px">孔子与《论语》核心思想</span>
        <span style="font-size:12px;color:var(--text2);margin-left:12px">11:45</span>
      </div>
      <div class="chapter-item">
        <span style="width:28px;font-size:13px;color:var(--text2)">1.3</span>
        <span style="flex:1;font-size:14px">孟子性善论与社会理想</span>
        <span style="font-size:12px;color:var(--text2);margin-left:12px">13:20</span>
      </div>
      <div class="chapter-item">
        <span style="width:28px;font-size:13px;color:var(--text2)">1.4</span>
        <span style="flex:1;font-size:14px">儒学在东亚文化圈的传播</span>
        <span style="font-size:12px;color:var(--text2);margin-left:12px">10:25</span>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:16px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);font-weight:600;display:flex;justify-content:space-between">
        <span>第二章 · 道家哲学</span><span>3 节 · 共 36 分钟</span>
      </div>
      <div class="chapter-item locked">
        <span style="width:28px;font-size:13px;color:var(--text2)">2.1</span>
        <span style="flex:1;font-size:14px">老子与《道德经》</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" style="margin-left:8px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style="font-size:12px;color:var(--text2);margin-left:12px">12:00</span>
      </div>
      <div class="chapter-item locked">
        <span style="width:28px;font-size:13px;color:var(--text2)">2.2</span>
        <span style="flex:1;font-size:14px">庄子的逍遥游与齐物论</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" style="margin-left:8px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style="font-size:12px;color:var(--text2);margin-left:12px">11:30</span>
      </div>
      <div class="chapter-item locked">
        <span style="width:28px;font-size:13px;color:var(--text2)">2.3</span>
        <span style="flex:1;font-size:14px">道家思想对中医的影响</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" style="margin-left:8px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style="font-size:12px;color:var(--text2);margin-left:12px">12:30</span>
      </div>
    </div>
  </main>
</div>

<!-- Player Bar -->
<div class="player-bar">
  <button class="btn-icon" title="上一节"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
  <button class="btn-play" title="播放/暂停"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
  <button class="btn-icon" title="下一节"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
  <div style="flex:1;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2)">
      <span>仁义礼智信的当代诠释</span><span>4:22 / 12:30</span>
    </div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>
  <button class="btn-icon" title="音量"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
</div>
</body>
</html>
